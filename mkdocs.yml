site_name: CYBERDECK ACADEMY
site_description: 500 Lessons in Cyberdeck Technologies
site_author: Your Name

theme:
  name: material
  language: en
  palette:
    # This sets the dark "Hacker" mode
    - scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    code: Roboto Mono  # Technical looking font
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Phase 1 Foundations: 
    - Overview: phase1-foundations/index.md
    - Lesson 1: phase1-foundations/lesson1.md